url: https://shihanli92.github.io/scroll/

template:
  bootstrap: 5

navbar:
  structure:
    left:  [reference, news]
    right: [search, github]

reference:
- title: Build & assemble
  desc: >
    Turn a processed Seurat object into an on-disk project, and attach
    reprocessed sub-embeddings as linked views.
  contents:
  - scroll_build
  - scroll_build_stream
  - scroll_update
  - scroll_add_meta
  - scroll_add_subset
  - vdj_spec
  - spatial_spec
  - atac_spec

- title: Run the app
  desc: Launch the runtime explorer, or preview a single panel while developing it.
  contents:
  - scroll_app
  - scroll_multi_app
  - scroll_serve
  - scroll_preview_panel

- title: Query layer
  desc: >
    The flat-RAM arrow query interface, usable programmatically without the app.
  contents:
  - scroll_connect
  - scroll_disconnect
  - scroll_manifest
  - scroll_query_feature
  - scroll_query_features
  - scroll_dequantize

- title: Differential expression
  desc: Live Wilcoxon markers and replicate-aware pseudobulk testing.
  contents:
  - scroll_de
  - scroll_pseudobulk_de

- title: Extend the app
  desc: >
    Register custom panels — declaratively from a plot function plus declared
    controls, or with the low-level module contract the built-ins use.
  contents:
  - register_plot_panel
  - register_panel
  - scroll_input
  - scroll_show_when
  - scroll_style_input
  - scroll_helpers
  - scroll_render_plot
  - scroll_columns
  - scroll_embeddings
  - scroll_features
  - scroll_reset_panels
